apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: ghcr.io/fateh-bensaali/myapp:77a4faa901a9f1e4b6fd4e667fea745c166da54a
        ports:
        - containerPort: 5000
