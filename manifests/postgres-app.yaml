apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Fateh-Bensaali/benslab.git'
    targetRevision: HEAD
    path: manifests/postgres/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
