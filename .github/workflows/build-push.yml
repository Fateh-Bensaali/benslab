name: Build and Push Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kustomize Image Tag
        run: |
          # Configure git identity for the automated bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"

          # Navigate to your Kustomize overlay directory (adjust path if needed)
          cd manifests/postgres/overlays/dev

          # Update the image tag using kustomize
          kustomize edit set image postgres=ghcr.io/${{ github.repository }}:${{ github.sha }}

          # Commit and push the updated manifest back to main
          git status
          git commit -am "chore: update postgres image tag to ${{ github.sha }}"
          git push
