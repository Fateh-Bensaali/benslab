name: Build and Push myapp

on:
  push:
    branches: [main]
    paths:
      - 'src/myapp/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set lowercase repo owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: src/myapp
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/myapp:${{ github.sha }}

      - name: Update deployment manifest
        run: |
          sed -i "s|image: ghcr.io/.*/myapp:.*|image: ghcr.io/${{ env.OWNER_LC }}/myapp:${{ github.sha }}|" apps/myapp/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/myapp/deployment.yaml
          git commit -m "Update myapp image to ${{ github.sha }}" || echo "No changes to commit"
          git push
